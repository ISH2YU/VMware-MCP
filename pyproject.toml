[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmware-mcp"
version = "0.1.0"
description = "Model Context Protocol server for VMware vSphere, vCenter Server and standalone ESXi hosts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ishayu Potey" }]
keywords = ["mcp", "model-context-protocol", "vmware", "vsphere", "vcenter", "esxi", "pyvmomi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.0.0",
    "pyvmomi>=8.0.3",
    "anyio>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
vmware-mcp = "vmware_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ISH2YU/VMware-MCP"
Repository = "https://github.com/ISH2YU/VMware-MCP"
Issues = "https://github.com/ISH2YU/VMware-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vmware_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pyVmomi.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "BLE", "N", "A"]
# B008: FastMCP-style defaults are evaluated once at registration on purpose.
# RUF005: concatenating property-name tuples reads better than unpacking here.
ignore = ["B008", "RUF005"]

[tool.mypy]
python_version = "3.10"
files = ["src/vmware_mcp"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
