name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The path sandbox and guest path joining are platform-sensitive,
          # so exercise them on Windows and macOS too.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=vmware_mcp --cov-report=term-missing

      - name: Verify the server advertises every tool
        shell: bash
        run: |
          python - <<'PY'
          import anyio
          import tempfile
          from pathlib import Path
          from vmware_mcp.config import Settings, PermissionMode, Product
          from vmware_mcp.server import create_server

          with tempfile.TemporaryDirectory() as directory:
              settings = Settings(
                  vm_dirs=(Path(directory),),
                  product=Product.WORKSTATION,
                  permission_mode=PermissionMode.READ_ONLY,
              )
              server = create_server(settings)
              tools = anyio.run(server.list_tools)
              assert len(tools) == 23, f"expected 23 tools, found {len(tools)}"
              assert all(tool.name.startswith("vmware_") for tool in tools)
              assert all(tool.description for tool in tools)
              print(f"{len(tools)} tools registered")
          PY
